"$schema" = 'https://starship.rs/config-schema.json'

#[line_break]
#disabled = false

add_newline = true
command_timeout = 1000
scan_timeout = 30

format = """
$os\
$username\
$hostname\
$directory\
$fill\
$vcsh\
$fossil_branch\
$fossil_metrics\
$git_branch\
$git_status\
$git_commit\
$git_state\
$git_metrics\
$hg_branch\
$hg_state\
$docker_context\
$package\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$conda\
$time\
$cmd_duration\
$line_break\
$character"""

[fill]
symbol = ' '

[os]
disabled = false

[os.symbols]
Windows = " "
Ubuntu = "󰕈 "
SUSE = " "
Raspbian = "󰐿  "
Mint = "󰣭 "
Macos = "󰀵 "
Manjaro = " "
Linux = "󰌽 "
Gentoo = "󰣨 "
Fedora = "󰣛 "
Alpine = " "
Amazon = " "
Android = " "
Arch = "󰣇 "
Artix = "󰣇 "
CentOS = " "
Debian = "󰣚 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "

[username]
#show_always = true
format = '[$user]($style)'

[hostname]
ssh_only = true
#symbol = '@ '
format = '@[$hostname](bold) '
disabled = false

[directory]
style = 'bold blue'
format = "[$path ]($style)"
truncation_length = 3
truncate_to_repo = true
#truncation_symbol = "…/"

#[directory.substitutions]
#"Documents" = "󰈙 "
#"Downloads" = " "
#"Music" = "󰝚 "
#"Pictures" = " "
#"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bold fg:#ff79c6"
format = ' [$symbol $branch]($style)'
#truncation_length = 4
#truncation_symbol = ' ' 

[git_status]
style = "bold fg:#ff4444"
format = '[ $all_status$ahead_behind ]($style)'

# Disable heavy git details
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
stashed = ""
modified = "!"
staged = "+"
renamed = ""
deleted = "✘"
untracked = "?"
conflicted = "⚠"

[nodejs]
symbol = " "
style = "bold green"
format = '[ $symbol($version) ]($style)'
detect_files = ["package.json", ".nvmrc"]

[c]
symbol = " "
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
format = '[ $symbol($version) ]($style)'

[php]
symbol = " "
format = '[ $symbol($version) ]($style)'

[java]
symbol = " "
format = '[ $symbol($version) ]($style)'

[kotlin]
symbol = " "
format = '[ $symbol($version) ]($style)'

[haskell]
symbol = " "
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
pyenv_version_name = true
pyenv_prefix = ''

[docker_context]
symbol = " "
style = 'fg:#06969A'
format = '[ $symbol($context) ]($style)'
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_extensions = ['Dockerfile']

[conda]
symbol = " "
format = '[$symbol$environment ]($style)'
ignore_base = false

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
min_time = 2000
show_milliseconds = true
format = '[  $duration]($style)'
disabled = false
show_notifications = true
min_time_to_notify = 45000

